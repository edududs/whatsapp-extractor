[project]
name = "whatsapp-extractor"
version = "0.2.1"
description = "Reusable piece: extract watched WhatsApp messages into a store and announce them."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
authors = [{ name = "Eduardo Lima", email = "dudulj15@gmail.com" }]
keywords = ["whatsapp", "neonize", "whatsmeow", "hexagonal-architecture", "asyncio", "event-bus"]
classifiers = [
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
    "Framework :: AsyncIO",
    "License :: OSI Approved :: MIT License",
    "Development Status :: 3 - Alpha",
    "Topic :: Communications :: Chat",
]
dependencies = [
    "aiosqlite>=0.22.1",
    "alembic>=1.20.0",
    "neonize>=0.4.3.post0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "sqlalchemy[asyncio]>=2.0.54",
    "tomlkit>=0.15.1",
    "typer>=0.27.2",
]

[project.urls]
Homepage = "https://github.com/edududs/whatsapp-extractor"
Repository = "https://github.com/edududs/whatsapp-extractor"
Changelog = "https://github.com/edududs/whatsapp-extractor/blob/main/CHANGELOG.md"
Issues = "https://github.com/edududs/whatsapp-extractor/issues"

[project.scripts]
whatsapp-extractor = "whatsapp_extractor.cli:app"

[project.optional-dependencies]
rich = [
    "rich>=15.0.0",
]
testing = [
    "hypothesis>=6.168.0",
]
postgres = [
    "asyncpg>=0.31.0",
]

[dependency-groups]
dev = [
    "poethepoet>=0.48.0",
    "pyright>=1.1.414",
    "pytest>=8",
    "pytest-asyncio>=1.2",
    "ruff>=0.16.8",
    "whatsapp-extractor[rich,testing]",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/whatsapp_extractor"]

[tool.pytest.ini_options]
pythonpath = ["tests"]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D",      # docstrings only where they add information, not one per symbol
    "CPY",    # no license header policy in this project
    "COM812", # conflicts with the formatter
]

[tool.ruff.lint.flake8-type-checking]
# pydantic evaluates field annotations at runtime: their imports cannot move to TYPE_CHECKING
runtime-evaluated-base-classes = [
    "pydantic.BaseModel",
    "pydantic_settings.BaseSettings",
    "whatsapp_extractor.domain.base.FrozenModel",
    "whatsapp_extractor.domain.events.DomainEvent",
]

[tool.ruff.lint.per-file-ignores]
"src/whatsapp_extractor/testing/*" = [
    "S101", # a test kit asserts: that is its job
]
"tests/*" = [
    "INP001",  # tests are a flat directory on pythonpath, not a package
    "S101",    # assert is how pytest works
    "PLR2004", # literal expected values are the point of a test
]

[tool.pyright]
include = ["src", "tests"]
extraPaths = ["src", "tests"]
typeCheckingMode = "strict"
reportMissingTypeStubs = false # neonize ships neither stubs nor py.typed

[tool.poe.tasks]
format = "ruff format"
lint = "ruff check --fix"
typecheck = "pyright"
test = "pytest -q"
fix = ["format", "lint", "typecheck", "test"]
# CI: same gate, but reports instead of rewriting files
check = ["format-check", "lint-check", "typecheck", "test"]
format-check = "ruff format --check"
lint-check = "ruff check"

[tool.uv.sources]
whatsapp-extractor = { workspace = true }
