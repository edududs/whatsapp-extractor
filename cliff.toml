# git-cliff: builds CHANGELOG.md and the release notes from the Conventional Commits.
# Keep a Changelog format, SemVer versions. Used by scripts/release.sh (docs/runbooks/release.md).

[changelog]
header = """
# Changelog

All notable changes to this project are documented in this file.

The format follows [Keep a Changelog](https://keepachangelog.com/en/1.1.0/) and releases follow
[Semantic Versioning](https://semver.org/spec/v2.0.0.html). git-cliff generates it from the
commit history: do not edit it by hand.

Before 1.0 the public contract still moves: `MINOR` adds features and may change the contract,
`PATCH` fixes.
"""
body = """

{% if version -%}
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d", timezone="America/Sao_Paulo") }}
{% else -%}
## [Unreleased]
{% endif -%}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}

{% for commit in commits -%}
- {% if commit.breaking %}**BREAKING** {% endif %}{% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | upper_first }}
{% endfor -%}
{% endfor -%}
"""
footer = """

{% for release in releases -%}
{% if release.version -%}
{% if release.previous.version -%}
[{{ release.version | trim_start_matches(pat="v") }}]: https://github.com/edududs/whatsapp-extractor/compare/{{ release.previous.version }}...{{ release.version }}
{% else -%}
[{{ release.version | trim_start_matches(pat="v") }}]: https://github.com/edududs/whatsapp-extractor/tree/{{ release.version }}
{% endif -%}
{% else -%}
[Unreleased]: https://github.com/edududs/whatsapp-extractor/compare/{{ release.previous.version }}...HEAD
{% endif -%}
{% endfor %}
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
protect_breaking_commits = true
tag_pattern = "v[0-9].*"
sort_commits = "oldest"
# The numbered comment only orders the groups; `striptags` removes it from the output.
commit_parsers = [
    { message = "^chore\\(release\\)", skip = true },
    { message = "^chore: release", skip = true },
    # Landed as feat, but it fixes a run that looked dead when nothing matched the watchlist.
    { sha = "94ba65ff79ae77cf0c6ca4e64358384ce0db3392", group = "<!-- 1 -->Fixed" },
    { message = "^feat", group = "<!-- 0 -->Added" },
    { message = "^fix", group = "<!-- 1 -->Fixed" },
    { message = "^perf", group = "<!-- 2 -->Performance" },
    { message = "^refactor", group = "<!-- 3 -->Changed" },
    { message = "^docs", group = "<!-- 4 -->Documentation" },
    { message = "^test", group = "<!-- 5 -->Tests" },
    { message = "^(build|ci|chore)", group = "<!-- 6 -->Infrastructure" },
]

[bump]
# Pre-1.0: a feature bumps MINOR and a breaking change also bumps MINOR, never MAJOR.
features_always_bump_minor = true
breaking_always_bump_major = false
